name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, zip
          coverage: none
      - run: composer install --no-interaction --no-progress
      # Fails on a known vulnerability in a dependency (FE-68).
      - run: composer audit
      - run: git config --global user.name CI && git config --global user.email ci@example.com
      - run: vendor/bin/phpunit
      # Wiring, architecture rules, routes and migrations, in the testing environment (no .env needed).
      # The tests use a database in memory, which every command starts empty, so check would see no table.
      # It checks a migrated file instead: the schema the application will have.
      - name: check, on a migrated database
        env:
          APP_ENV: testing
          APP_DATABASE__CONNECTIONS__MAIN__DATABASE: ${{ runner.temp }}/ci.sqlite
        run: |
          php bin/console migrate
          php bin/console check
